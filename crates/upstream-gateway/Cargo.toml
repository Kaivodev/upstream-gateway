[package]
name = "upstream-gateway"
version = "0.7.0"
edition = "2024"
publish = false

[dependencies]
upstream-host = { path = "../upstream-host" }
kaivo-upstream-sdk = { path = "../../guest/sdk" }
anyhow = "1"
base64 = "0.23"
bytes = "1"
deadpool-postgres = "0.14"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-reflect = "0.16"
prost-types = "0.14"
libc = "0.2"
regex = { version = "1", default-features = false, features = ["std"] }
ring = "0.17"
num-bigint = "0.4"
rsa = { version = "0.10", features = ["pkcs1v15"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
x509-parser = "0.18"
tower = { version = "0.5", features = ["util"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures-util = "0.3"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync", "signal"] }
tokio-postgres = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "server", "router"] }
tonic-prost = "0.14"
uuid = { version = "1", features = ["v7"] }
webpki-roots = "1"
zeroize = "1"

[build-dependencies]
protox = "0.10"
tonic-prost-build = { version = "0.14", default-features = false }

[dev-dependencies]
tonic = { version = "0.14", features = ["channel", "tls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tempfile = "3"
md-5 = "0.11"

