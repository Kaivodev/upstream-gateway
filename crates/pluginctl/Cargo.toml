[package]
publish = false
name = "pluginctl"
version = "0.3.0"
edition = "2024"

[dependencies]
upstream-host = { path = "../upstream-host" }
anyhow = "1"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

[dev-dependencies]
getrandom = "0.4"
zeroize = "1"
wasmtime = { version = "=48.0.10", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "anyhow"] }
