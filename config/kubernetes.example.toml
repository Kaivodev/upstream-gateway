role = "trade"
mode = "development"
transport = "plaintext"
listen = "0.0.0.0:9107"
allowed_peers = ["payment"]
# Schema changes run in a separate Job: upstream-gateway migrate --app-role <application role>,
# with the owner role's URL. This process connects with the application role.
database_url_env = "GATEWAY_DATABASE_URL"
allow_loopback_http = false
allow_private_http = true
allow_uncommitted = false

[kms]
key = "projects/kaivokms/locations/asia-southeast1/keyRings/test-business/cryptoKeys/upstream-gateway-trade-kek"
wrapped_key_file = "/run/kaivo/sealing/kek.json"
credentials_file = "/etc/kaivo/gcp/credentials.json"
egress_proxy = "gateway-egress.kaivo-business.svc:3128"

[service_token]
jwks_file = "/run/kaivo/issuer/jwks.json"
issuer_file = "/run/kaivo/issuer/issuer"

[service_token.service_namespaces]
payment = "kaivo-business"

[timing]
heartbeat_ms = 3000
fence_ms = 30000
