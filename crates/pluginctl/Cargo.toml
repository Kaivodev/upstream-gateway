[package]
publish = false
name = "pluginctl"
version = "0.7.0"
edition = "2024"

[dependencies]
upstream-host = { path = "../upstream-host" }
anyhow = "1"
base64 = "0.23"
kaivo-upstream-sdk = { path = "../../guest/sdk" }
md-5 = "0.11"
serde = { version = "1", features = ["derive"] }
zeroize = "1"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

[dev-dependencies]
getrandom = "0.4"
wasmtime = { version = "=48.0.10", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "anyhow"] }
